name: Build Windows EXE

on:
  push:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "play-something.spec"
      - "stockfish/stockfish-windows-x86-64-universal.exe"
      - ".github/workflows/build-windows-exe.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "play-something.spec"
      - "stockfish/stockfish-windows-x86-64-universal.exe"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.13.0

      - name: Build EXE
        run: python -m PyInstaller play-something.spec

      - name: Smoke test EXE
        run: '& .\dist\play-something.exe --help'

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-something-windows-exe
          path: dist/play-something.exe
