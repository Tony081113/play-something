name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name play-something main.py

      - name: Smoke test EXE
        run: .\dist\play-something.exe --help

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-something-windows-exe
          path: dist/play-something.exe
